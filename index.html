<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eSaraban PRO+</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body { font-family:'Prompt'; background:#f1f5f9; }
.sidebar { background:linear-gradient(180deg,#2563eb,#1e3a8a); }
</style>
</head>

<body class="flex">

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar w-64 min-h-screen text-white p-6">
<h1 class="text-xl font-bold mb-6">eSaraban</h1>

<div class="space-y-3 text-sm">
<div class="p-3 bg-white/20 rounded-xl">🏠 หน้าหลัก</div>
<div class="p-3">📄 หนังสือทั้งหมด</div>
<div class="p-3">📅 ปฏิทิน</div>
</div>
</div>

<!-- MAIN -->
<div class="flex-1">

<!-- TOP -->
<div class="bg-white p-4 flex justify-between items-center shadow">
<div class="flex gap-3 items-center">
<button onclick="toggleSidebar()">☰</button>
<h2 class="font-bold">ระบบสารบรรณ อบต.ชำผักแพว</h2>
</div>

<div class="flex gap-2">
<button onclick="openLogin()" class="bg-blue-500 text-white px-3 py-1 rounded">Admin</button>
<img src="https://i.pravatar.cc/40" class="w-8 h-8 rounded-full">
</div>
</div>

<div class="p-6 grid lg:grid-cols-3 gap-6">

<!-- LEFT -->
<div class="lg:col-span-2">

<!-- DASHBOARD -->
<div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

<!-- TABLE -->
<div class="bg-white rounded-xl shadow p-4">

<h3 class="font-bold mb-3">หนังสือล่าสุด</h3>

<table class="w-full text-sm">
<thead class="border-b">
<tr>
<th>เลขรับ</th>
<th>เรื่อง</th>
<th>จาก</th>
<th>วันที่</th>
<th>สถานะ</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

<!-- RIGHT -->
<div class="space-y-6">

<!-- NOTIFY -->
<div class="bg-white p-4 rounded-xl shadow">
<h3 class="font-bold mb-3">แจ้งเตือน</h3>
<ul id="notify"></ul>
</div>

<!-- CALENDAR -->
<div class="bg-white p-4 rounded-xl shadow">
<h3 class="font-bold mb-3">ปฏิทิน</h3>
<div id="calendar" class="grid grid-cols-7 text-center text-xs gap-1"></div>
</div>

</div>

</div>

</div>

<!-- LOGIN -->
<div id="loginModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
<div class="bg-white p-6 rounded text-center">
<input id="pass" type="password" class="border p-3 mb-3">
<button onclick="login()" class="bg-blue-500 text-white p-2 w-full">Login</button>
</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbyGa_dNlU6HQTbRYHL5qvY0U3og8US0VCJMsEK6SaBm8U7onG7SzkrhZurYZ6H1rsFV/exec";

let docs=[];
let isAdmin=false;

/* LOAD */
async function load(){
let res=await fetch(API+"?action=read");
docs=await res.json();
render();
}

/* RENDER */
function render(){

// DASHBOARD
stats.innerHTML=`
<div class="bg-blue-500 text-white p-4 rounded-xl">ทั้งหมด ${docs.length}</div>
<div class="bg-green-500 text-white p-4 rounded-xl">ลงรับ ${docs.filter(d=>d.status==="ลงรับแล้ว").length}</div>
<div class="bg-orange-500 text-white p-4 rounded-xl">เสนอ ${docs.filter(d=>d.status==="กำลังเสนอ").length}</div>
<div class="bg-purple-500 text-white p-4 rounded-xl">เสร็จ ${docs.filter(d=>d.status==="เสร็จสิ้น").length}</div>
`;

// TABLE
table.innerHTML=docs.map(d=>`
<tr class="border-b">
<td>${d.receiveNo2||'-'}</td>
<td>${d.subject}</td>
<td>${d.fromOrg||'-'}</td>
<td>${formatDate(d.receivedDate)}</td>
<td>${d.status}</td>
</tr>
`).join('');

// NOTIFY
notify.innerHTML=docs.slice(0,5).map(d=>`
<li class="text-sm border-b py-1">📄 ${d.subject}</li>
`).join('');

// CALENDAR
renderCalendar();

}

/* CALENDAR */
function renderCalendar(){
calendar.innerHTML="";
for(let i=1;i<=30;i++){
calendar.innerHTML+=`<div class="p-2 border">${i}</div>`;
}
}

/* DATE */
function formatDate(d){
if(!d) return '-';
return new Date(d).toLocaleDateString('th-TH');
}

/* SIDEBAR */
function toggleSidebar(){
sidebar.classList.toggle("hidden");
}

/* LOGIN */
function openLogin(){
loginModal.classList.remove("hidden");
}

function login(){
if(pass.value==="123456"){
isAdmin=true;
loginModal.classList.add("hidden");
alert("เข้าสู่โหมด Admin");
}
}

/* START */
load();

</script>

</body>
</html>
