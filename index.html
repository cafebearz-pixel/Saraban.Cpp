<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสารบัญ CPP | อบต.ชำผักแพว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; font-family: 'Sarabun', sans-serif; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 28px; transition: 0.3s; position: relative; }
        
        /* สไตล์ใหม่สำหรับสถานะ (Progress Bar) ป้องกันข้อความซ้อนทับ */
        .progress-wrapper { position: relative; padding: 20px 0 30px; margin-top: 20px; }
        .progress-line { height: 4px; background: #e2e8f0; border-radius: 10px; position: relative; }
        .progress-fill { position: absolute; height: 100%; background: #0F172A; border-radius: 10px; transition: 0.5s; }
        .status-steps { display: flex; justify-content: space-between; position: absolute; width: 100%; top: 16px; }
        .step { display: flex; flex-direction: column; align-items: center; width: 33.33%; position: relative; }
        .step-dot { width: 12px; height: 12px; border-radius: 50%; background: white; border: 2px solid #cbd5e1; position: absolute; top: -10px; z-index: 10; }
        .step.active .step-dot { background: #0F172A; border-color: #0F172A; }
        .step-label { font-size: 10px; font-weight: 700; color: #94a3b8; margin-top: 8px; text-align: center; white-space: nowrap; }
        .step.active .step-label { color: #0F172A; }
    </style>
</head>
<body class="antialiased">

    <!-- Navbar และส่วนอื่นๆ เหมือนเดิม -->
    <nav class="bg-[#0F172A] text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-file-invoice text-[#D4AF37] text-2xl"></i>
            <span class="font-bold tracking-tight">SARABAN CPP</span>
        </div>
        <button id="authBtn" onclick="toggleAuth()" class="bg-white text-[#0F172A] px-5 py-2 rounded-full text-xs font-bold transition-all">
            <span id="authLabel">GUEST MODE</span>
        </button>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="stats-area" class="grid grid-cols-2 lg:grid-cols-4 gap-5 mb-8"></div>

        <div class="flex flex-wrap gap-3 mb-4 bg-white/40 backdrop-blur p-2.5 rounded-[24px] border border-white shadow-sm">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-8 py-3 rounded-xl font-bold bg-[#0F172A] text-white flex-1 md:flex-none">หน้าแรก</button>
            <button onclick="switchTab('by-owner')" id="tab-by-owner" class="px-8 py-3 rounded-xl font-bold bg-white text-gray-400 flex-1 md:flex-none">สถิติแยกกองงาน</button>
            <button id="addDocBtn" onclick="openModal()" class="hidden bg-[#D4AF37] text-[#0F172A] px-8 py-3 rounded-xl font-black ml-auto">ลงรับหนังสือใหม่</button>
        </div>

        <div id="view-dashboard" class="block"><div id="dashboard-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div></div>
        
        <div id="view-by-owner" class="hidden">
            <div class="bg-white p-8 rounded-[35px] shadow-sm mb-8 border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="font-black text-[#0F172A] uppercase">ตรวจสอบตามกองงาน</div>
                <select id="ownerFilter" onchange="renderByOwner()" class="bg-gray-100 p-4 rounded-2xl outline-none font-bold w-full md:w-80">
                    <option value="">-- เลือกกองงาน --</option>
                    <option value="สำนักปลัด">สำนักปลัด</option><option value="กองคลัง">กองคลัง</option><option value="กองช่าง">กองช่าง</option><option value="กองการศึกษา">กองการศึกษา</option><option value="นักทรัพย์">นักทรัพย์</option><option value="นิติกร">นิติกร</option><option value="งานป้องกัน">งานป้องกัน</option><option value="งานสภา">งานสภา</option><option value="ประชาสัมพันธ์">ประชาสัมพันธ์</option><option value="นักจัดการ">นักจัดการ</option><option value="สาธารณสุข">สาธารณสุข</option><option value="สปสช">สปสช</option><option value="ตรวจสอบภายใน">ตรวจสอบภายใน</option><option value="ธุรการ">ธุรการ</option><option value="เกษตร">เกษตร</option><option value="สิ่งแวดล้อม">สิ่งแวดล้อม</option>
                </select>
            </div>
            <div id="owner-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </main>

    <!-- Modal Form และ Script แก้ไขชื่อ ID ให้ตรงกับชีท -->
    <script>
        const API_URL = "วาง URL ที่คัดลอกมาตรงนี้";
        let isAdmin = false, documents = [];

        async function fetchData() {
            const res = await fetch(API_URL + "?action=read");
            documents = await res.json() || [];
            renderAll();
        }

        // ฟังก์ชัน renderCards ปรับปรุง Progress Bar
        function renderCards(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const statusFlow = ["ลงรับแล้ว", "กำลังเสนอ", "เสร็จสิ้น"];
            
            list.forEach(d => {
                const currentStep = statusFlow.indexOf(d.status);
                const progressWidth = (currentStep / 2) * 100 + '%';
                const hasLink = d.fileUrl && d.fileUrl.length > 5;

                container.innerHTML += `
                <div class="glass-card p-8 flex flex-col h-full">
                    <div class="mb-6">
                        <span class="text-[10px] font-black px-2 py-1 rounded-lg bg-amber-100 text-amber-600">${d.status}</span>
                        <div class="text-xs text-gray-400 mt-4 uppercase">เลขรับหนังสือ :</div>
                        <div class="text-xl font-black text-[#0F172A] mb-2">${d.receiveNo || '-'}</div>
                        <div class="text-sm font-bold text-gray-700 line-clamp-2">${d.subject}</div>
                    </div>
                    
                    <div class="flex-grow border-t pt-4 space-y-2 text-xs text-gray-500">
                        <div>จาก: <span class="font-bold text-gray-700">${d.fromOrg || '-'}</span></div>
                        <div>ผู้รับผิดชอบ: <span class="font-bold text-gray-700">${d.owner || 'รอระบุ'}</span></div>
                        ${hasLink ? `<a href="${d.fileUrl}" target="_blank" class="block w-full bg-blue-600 text-white text-center py-3 rounded-2xl font-bold mt-4">เปิดดูเอกสาร PDF</a>` : ''}
                    </div>

                    <div class="progress-wrapper">
                        <div class="progress-line">
                            <div class="progress-fill" style="width: ${progressWidth}"></div>
                        </div>
                        <div class="status-steps">
                            ${statusFlow.map((s, i) => `
                                <div class="step ${currentStep >= i ? 'active' : ''}">
                                    <div class="step-dot"></div>
                                    <div class="step-label">${s}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
            });
        }
        
        // รัน fetchData ทันที
        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
