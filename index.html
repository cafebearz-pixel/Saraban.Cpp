<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>eSaraban Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Prompt', sans-serif; background:#f1f5f9; }
.sidebar { background: linear-gradient(180deg,#2563eb,#1e3a8a); }
</style>

</head>

<body class="flex">

<!-- SIDEBAR -->
<div class="sidebar w-64 min-h-screen text-white p-6">

  <h1 class="text-xl font-bold mb-6">eSaraban</h1>

  <div class="space-y-3">
    <div class="bg-white/20 p-3 rounded-xl">🏠 หน้าหลัก</div>
    <div class="p-3">📄 หนังสือทั้งหมด</div>
  </div>

</div>

<!-- MAIN -->
<div class="flex-1 p-6">

<h2 class="text-2xl font-bold mb-6">ระบบสารบรรณ อบต.ชำผักแพว</h2>

<!-- CARDS -->
<div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

<!-- SEARCH -->
<input id="search" placeholder="ค้นหา..."
class="w-full p-4 rounded-xl border mb-6">

<!-- TABLE -->
<div class="bg-white rounded-xl shadow p-4">

<table class="w-full">
<thead class="text-left border-b">
<tr>
<th>เลขรับ</th>
<th>เรื่อง</th>
<th>จาก</th>
<th>วันที่</th>
<th>สถานะ</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGa_dNlU6HQTbRYHL5qvY0U3og8US0VCJMsEK6SaBm8U7onG7SzkrhZurYZ6H1rsFV/exec";

let docs = [];

async function load(){
  let res = await fetch(API + "?action=read");
  docs = await res.json();

  render(docs);
}

function render(data){

  // DASHBOARD
  document.getElementById("stats").innerHTML = `
    <div class="bg-blue-500 text-white p-5 rounded-xl">
      <p>ทั้งหมด</p>
      <h2 class="text-2xl font-bold">${data.length}</h2>
    </div>

    <div class="bg-green-500 text-white p-5 rounded-xl">
      <p>ลงรับแล้ว</p>
      <h2 class="text-2xl font-bold">
      ${data.filter(d=>d.status==="ลงรับแล้ว").length}</h2>
    </div>

    <div class="bg-orange-500 text-white p-5 rounded-xl">
      <p>กำลังเสนอ</p>
      <h2 class="text-2xl font-bold">
      ${data.filter(d=>d.status==="กำลังเสนอ").length}</h2>
    </div>

    <div class="bg-purple-500 text-white p-5 rounded-xl">
      <p>เสร็จสิ้น</p>
      <h2 class="text-2xl font-bold">
      ${data.filter(d=>d.status==="เสร็จสิ้น").length}</h2>
    </div>
  `;

  // TABLE
  document.getElementById("table").innerHTML = data.map(d => `
    <tr class="border-b hover:bg-gray-50">

      <td class="p-2 font-bold">${d.receiveNo2 || '-'}</td>
      <td>${d.subject}</td>
      <td>${d.fromOrg || '-'}</td>
      <td>${formatDate(d.receivedDate)}</td>

      <td>
        <span class="px-3 py-1 rounded-full text-xs
        ${d.status==='เสร็จสิ้น'?'bg-green-100 text-green-600':
          d.status==='กำลังเสนอ'?'bg-orange-100 text-orange-600':
          'bg-blue-100 text-blue-600'}">
          ${d.status}
        </span>
      </td>

    </tr>
  `).join('');
}

function formatDate(d){
  if(!d) return '-';
  return new Date(d).toLocaleDateString('th-TH');
}

// SEARCH
document.getElementById("search").onkeyup = function(){
  let q = this.value.toLowerCase();

  let filtered = docs.filter(d =>
    `${d.subject} ${d.fromOrg} ${d.receiveNo2}`.toLowerCase().includes(q)
  );

  render(filtered);
};

load();

</script>

</body>
</html>
