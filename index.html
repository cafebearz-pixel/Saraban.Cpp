<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสารบัญ CPP | อบต.ชำผักแพว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'] },
                    colors: { primary: '#0F172A', gold: '#D4AF37', accent: '#1E293B' }
                }
            }
        }
    </script>
    <style>
        body { background: #f8fafc; font-family: 'Sarabun', sans-serif; transition: all 0.3s; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 24px; transition: 0.3s; }
        .glass-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -10px rgba(0,0,0,0.1); }
        .btn-tab { padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 14px; transition: 0.2s; }
        .progress-track { height: 4px; background: #e2e8f0; border-radius: 10px; position: relative; margin: 25px 0; }
        .progress-fill { position: absolute; height: 100%; background: #0F172A; border-radius: 10px; transition: 0.4s; }
        .dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; background: white; border: 2px solid #cbd5e1; }
        .dot.active { border-color: #0F172A; background: #0F172A; }
    </style>
</head>
<body class="antialiased">

    <!-- Nav -->
    <nav class="bg-primary text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <div class="bg-gold p-1.5 rounded-lg text-primary"><i class="fa-solid fa-file-contract"></i></div>
            <span class="font-bold tracking-tight">SARABAN CPP</span>
        </div>
        <button id="authBtn" onclick="toggleAuth()" class="bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-full text-xs font-bold transition border border-white/20">
            <span id="authLabel">GUEST MODE</span>
        </button>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Big Number Stats -->
        <div id="stats-area" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6"></div>

        <!-- Navigation Buttons (Moved under stats) -->
        <div class="flex flex-wrap gap-2 mb-8 bg-white p-2 rounded-2xl border border-gray-100 shadow-sm">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="btn-tab bg-primary text-white flex-1 md:flex-none">หน้าแรก</button>
            <button onclick="switchTab('completed')" id="tab-completed" class="btn-tab bg-gray-50 text-gray-400 hover:bg-gray-100 flex-1 md:flex-none">งานเสร็จสิ้นแล้ว</button>
            <button onclick="switchTab('search')" id="tab-search" class="btn-tab bg-gray-50 text-gray-400 hover:bg-gray-100 flex-1 md:flex-none"><i class="fa-solid fa-search"></i> ค้นหา</button>
            <button id="addDocBtn" onclick="openModal()" class="hidden ml-auto bg-gold text-primary btn-tab shadow-lg shadow-gold/20"><i class="fa-solid fa-plus"></i> ลงรับหนังสือ</button>
        </div>

        <!-- Views -->
        <div id="view-dashboard" class="block"><div id="dashboard-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div></div>
        <div id="view-completed" class="hidden"><div id="completed-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div></div>
        <div id="view-search" class="hidden">
            <input type="text" id="searchInput" onkeyup="searchDocs()" placeholder="พิมพ์เลขรับ หรือชื่อเรื่อง..." class="w-full p-4 rounded-2xl border-none shadow-sm mb-6 outline-none focus:ring-2 focus:ring-primary">
            <div id="search-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

    </main>

    <!-- Modal Form -->
    <div id="docModal" class="hidden fixed inset-0 bg-primary/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[32px] p-8 w-full max-w-3xl overflow-y-auto max-h-[90vh] shadow-2xl">
            <h3 class="text-xl font-black text-primary mb-6 flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-gold"></i> บันทึกหนังสือรับ</h3>
            <form id="docForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="hidden" id="docId">
                <div class="md:col-span-1"><label class="text-[10px] font-black text-gray-400 uppercase">เลขรับหนังสือ</label><input type="text" id="f_receiveNo" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none"></div>
                <div class="md:col-span-2"><label class="text-[10px] font-black text-gray-400 uppercase">ชื่อเรื่องรับ</label><input type="text" id="f_subject" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none font-bold"></div>
                
                <div class="md:col-span-1"><label class="text-[10px] font-black text-gray-400 uppercase">วันที่ออกหนังสือ</label><input type="date" id="f_bookDate" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none"></div>
                <div class="md:col-span-1"><label class="text-[10px] font-black text-gray-400 uppercase">วันที่ลงรับ</label><input type="date" id="f_receivedDate" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none"></div>
                <div class="md:col-span-1"><label class="text-[10px] font-black text-gray-400 uppercase">ผู้รับผิดชอบได้รับวันที่</label><input type="date" id="f_ownerReceivedDate" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none"></div>

                <div class="md:col-span-2"><label class="text-[10px] font-black text-gray-400 uppercase">ส่งจากหน่วยงาน</label><input type="text" id="f_fromOrg" list="org-list" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none"><datalist id="org-list"></datalist></div>
                <div class="md:col-span-1"><label class="text-[10px] font-black text-gray-400 uppercase">ผู้รับผิดชอบ (กองงาน)</label>
                    <select id="f_owner" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none">
                        <option value="">-- รอระบุ --</option><option value="สำนักปลัด">สำนักปลัด</option><option value="กองคลัง">กองคลัง</option><option value="กองช่าง">กองช่าง</option><option value="กองการศึกษา">กองการศึกษา</option><option value="นักทรัพย์">นักทรัพย์</option><option value="นิติกร">นิติกร</option><option value="งานป้องกัน">งานป้องกัน</option><option value="งานสภา">งานสภา</option><option value="ประชาสัมพันธ์">ประชาสัมพันธ์</option><option value="นักจัดการ">นักจัดการ</option><option value="สาธารณสุข">สาธารณสุข</option><option value="สปสช">สปสช</option><option value="ตรวจสอบภายใน">ตรวจสอบภายใน</option><option value="ธุรการ">ธุรการ</option><option value="เกษตร">เกษตร</option><option value="สิ่งแวดล้อม">สิ่งแวดล้อม</option>
                    </select>
                </div>
                <div class="md:col-span-3"><label class="text-[10px] font-black text-gray-400 uppercase">ลิงก์ Google Drive</label><input type="text" id="f_fileUrl" placeholder="วางลิงก์เอกสารที่นี่..." class="w-full bg-blue-50 border-none rounded-xl p-3 outline-none text-blue-600"></div>

                <div class="md:col-span-3 flex justify-end gap-3 mt-4 border-t pt-6">
                    <button type="button" onclick="closeModal()" class="px-6 py-2 text-gray-400 font-bold">ยกเลิก</button>
                    <button type="button" onclick="saveDoc()" id="btnSave" class="px-10 py-3 bg-primary text-white font-bold rounded-2xl shadow-xl shadow-primary/20 transition hover:bg-black">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-primary/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[40px] p-10 max-w-sm w-full text-center shadow-2xl">
            <h3 class="text-2xl font-black text-primary mb-6">ADMIN ACCESS</h3>
            <input type="password" id="passwordInput" placeholder="รหัสผ่าน" class="w-full bg-gray-100 rounded-2xl p-4 text-center text-3xl outline-none mb-6">
            <button onclick="attemptLogin()" class="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-xl hover:bg-black transition">ยืนยัน</button>
            <button onclick="closeLoginModal()" class="mt-4 text-gray-400 text-sm">ยกเลิก</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzbp68pMAVTctC05s_alIhRIscXNms9w-D7K5VwzAIp-_JmLKZ24PCADTRn7AmNw7T6/exec";
        let isAdmin = false, documents = [];

        document.addEventListener('DOMContentLoaded', fetchData);

        async function fetchData() {
            try { const res = await fetch(API_URL + "?action=read"); documents = await res.json() || []; renderAll(); updateOrgList(); } catch (e) {}
        }

        function toggleAuth() { if(isAdmin) { isAdmin = false; updateAuthUI(); } else document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }
        function attemptLogin() { if(document.getElementById('passwordInput').value === 'cp123'){ isAdmin=true; closeLoginModal(); updateAuthUI(); document.getElementById('passwordInput').value=''; } else alert('รหัสผิด'); }
        function updateAuthUI() { document.getElementById('authLabel').innerText = isAdmin ? 'ADMIN MODE' : 'GUEST MODE'; document.getElementById('addDocBtn').classList.toggle('hidden', !isAdmin); renderAll(); }
        
        function switchTab(t) { 
            ['dashboard', 'completed', 'search'].forEach(v => {
                document.getElementById(`view-${v}`).classList.toggle('hidden', v!==t);
                const btn = document.getElementById(`tab-${v}`);
                if(btn) {
                    btn.classList.toggle('bg-primary', v===t); btn.classList.toggle('text-white', v===t);
                    btn.classList.toggle('bg-gray-50', v!==t); btn.classList.toggle('text-gray-400', v!==t);
                }
            });
            renderAll(); 
        }

        function openModal(id = null) {
            document.getElementById('docModal').classList.remove('hidden');
            document.getElementById('docForm').reset();
            document.getElementById('docId').value = id ? id : '';
            if(id) {
                const d = documents.find(x => x.id === id);
                document.getElementById('f_receiveNo').value = d.receiveNo || '';
                document.getElementById('f_subject').value = d.subject || '';
                document.getElementById('f_fromOrg').value = d.fromOrg || '';
                document.getElementById('f_bookDate').value = d.bookDate || '';
                document.getElementById('f_receivedDate').value = d.receivedDate || '';
                document.getElementById('f_ownerReceivedDate').value = d.ownerReceivedDate || '';
                document.getElementById('f_owner').value = d.owner || '';
                document.getElementById('f_fileUrl').value = d.fileUrl || '';
            }
        }
        function closeModal() { document.getElementById('docModal').classList.add('hidden'); }

        async function saveDoc() {
            const id = document.getElementById('docId').value || 'ID-' + Date.now();
            const doc = {
                id: id,
                receiveNo: document.getElementById('f_receiveNo').value,
                subject: document.getElementById('f_subject').value,
                fromOrg: document.getElementById('f_fromOrg').value,
                bookDate: document.getElementById('f_bookDate').value,
                receivedDate: document.getElementById('f_receivedDate').value,
                ownerReceivedDate: document.getElementById('f_ownerReceivedDate').value,
                owner: document.getElementById('f_owner').value,
                fileUrl: document.getElementById('f_fileUrl').value,
                status: document.getElementById('docId').value ? documents.find(x=>x.id===id).status : "ลงรับแล้ว"
            };
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: document.getElementById('docId').value?'update':'create', data: doc }) });
            closeModal(); fetchData();
        }

        async function updateStatus(id, s) {
            documents.find(x=>x.id===id).status = s; renderAll();
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStatus', id: id, status: s }) });
            fetchData();
        }

        async function deleteDoc(id) {
            if(!confirm('ลบรายการนี้?')) return;
            documents = documents.filter(x=>x.id!==id); renderAll();
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', id: id }) });
        }

        function renderAll() {
            renderStats();
            renderCards(documents, 'dashboard-cards');
            renderCards(documents.filter(x=>x.status==="เสร็จสิ้น"), 'completed-cards');
        }

        function renderStats() {
            const area = document.getElementById('stats-area');
            const now = new Date().getMonth();
            const countMonth = documents.filter(x => x.receivedDate && new Date(x.receivedDate).getMonth() === now).length;
            area.innerHTML = `
                <div class="glass-card p-5"><p class="text-[10px] font-black text-gray-400">งานเดือนนี้</p><h3 class="text-2xl font-black text-primary">${countMonth}</h3></div>
                <div class="glass-card p-5"><p class="text-[10px] font-black text-gray-400">ลงรับแล้ว</p><h3 class="text-2xl font-black text-amber-500">${documents.filter(x=>x.status==="ลงรับแล้ว").length}</h3></div>
                <div class="glass-card p-5"><p class="text-[10px] font-black text-gray-400">กำลังเสนอ</p><h3 class="text-2xl font-black text-indigo-500">${documents.filter(x=>x.status==="กำลังเสนอ").length}</h3></div>
                <div class="bg-primary p-5 rounded-[24px] shadow-lg"><p class="text-[10px] font-black text-blue-200">เสร็จสิ้น</p><h3 class="text-2xl font-black text-white">${documents.filter(x=>x.status==="เสร็จสิ้น").length}</h3></div>
            `;
        }

        function updateOrgList() {
            const datalist = document.getElementById('org-list');
            const orgs = [...new Set(documents.map(d => d.fromOrg).filter(o => o))];
            datalist.innerHTML = orgs.map(o => `<option value="${o}">`).join('');
        }

        function searchDocs() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderCards(documents.filter(x => (x.subject||'').toLowerCase().includes(q) || (x.receiveNo||'').toLowerCase().includes(q)), 'search-cards');
        }

        function renderCards(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const statusFlow = ["ลงรับแล้ว", "กำลังเสนอ", "เสร็จสิ้น"];
            list.forEach(d => {
                const currentStep = statusFlow.indexOf(d.status);
                const progressWidth = (currentStep / 2) * 100 + '%';
                container.innerHTML += `
                <div class="glass-card p-6 flex flex-col h-full relative">
                    ${isAdmin ? `<div class="absolute top-5 right-5 flex gap-3 text-gray-300"><button onclick="openModal('${d.id}')" class="hover:text-blue-500"><i class="fa-solid fa-edit"></i></button><button onclick="deleteDoc('${d.id}')" class="hover:text-red-500"><i class="fa-solid fa-trash"></i></button></div>`:''}
                    <div class="mb-4"><span class="text-[9px] font-black bg-gray-100 px-2 py-1 rounded">REF: ${d.receiveNo || '-'}</span><h4 class="text-md font-bold text-gray-900 mt-2 leading-tight line-clamp-2">${d.subject || 'ไม่มีหัวข้อ'}</h4></div>
                    <div class="space-y-2 text-xs text-gray-500 mb-6 flex-grow">
                        <p><i class="fa-solid fa-building w-4"></i> จาก: <span class="font-bold text-gray-700">${d.fromOrg || '-'}</span></p>
                        <p><i class="fa-solid fa-user-circle w-4"></i> รับผิดชอบ: <span class="font-bold text-gray-700">${d.owner || 'ยังไม่ระบุ'}</span></p>
                        <p><i class="fa-solid fa-calendar w-4"></i> วันที่รับ: <span class="font-bold text-gray-700">${d.receivedDate || '-'}</span></p>
                        ${d.fileUrl ? `<a href="${d.fileUrl}" target="_blank" class="flex items-center justify-center gap-2 w-full bg-blue-50 text-blue-600 py-2 rounded-xl font-bold mt-2 hover:bg-blue-100"><i class="fa-solid fa-file-pdf"></i> เปิดดูเอกสาร</a>`:''}
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${progressWidth}"></div>
                        ${statusFlow.map((s, i) => `<div class="dot ${currentStep >= i ? 'active' : ''}" style="left: ${i * 50}%"></div>`).join('')}
                    </div>
                    ${isAdmin ? `<div class="flex justify-between mt-4"><button onclick="updateStatus('${d.id}', '${statusFlow[currentStep-1]}')" class="text-[10px] font-bold text-gray-400 ${currentStep===0?'invisible':''}">ย้อนกลับ</button><button onclick="updateStatus('${d.id}', '${statusFlow[currentStep+1]}')" class="bg-primary text-white px-4 py-1.5 rounded-lg text-[10px] font-bold ${currentStep===2?'hidden':''}">ถัดไป</button></div>`:''}
                </div>`;
            });
        }
    </script>
</body>
</html>
