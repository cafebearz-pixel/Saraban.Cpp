<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสารบัญทะเบียนหนังสือรับ | อบต.ชำผักแพว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'] },
                    colors: {
                        primary: '#0F2B46',
                        primaryLight: '#1E4C7A',
                        accent: '#D4AF37',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-shadow { box-shadow: 0 4px 20px rgba(15, 43, 70, 0.08); transition: all 0.3s ease; }
        .card-shadow:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(15, 43, 70, 0.12); }
        
        /* สไตล์หลอดสถานะ */
        .progress-container { position: relative; height: 8px; background: #e2e8f0; border-radius: 10px; margin: 25px 0 40px; }
        .progress-bar { position: absolute; height: 100%; background: #1E4C7A; border-radius: 10px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .step-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: white; border: 3px solid #cbd5e1; transition: all 0.3s ease; }
        .step-dot.active { border-color: #1E4C7A; background: #1E4C7A; box-shadow: 0 0 0 4px rgba(30, 76, 122, 0.2); }
        .step-label { position: absolute; top: 20px; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: #64748b; white-space: nowrap; }
        .step-label.active { color: #1E4C7A; }
    </style>
</head>
<body class="antialiased font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-primary text-white shadow-xl sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center space-x-6">
                    <div class="flex items-center gap-3">
                        <div class="bg-accent p-2 rounded-lg"><i class="fa-solid fa-file-invoice text-primary text-xl"></i></div>
                        <span class="font-bold text-xl tracking-tight">Saraban Champakpaew</span>
                    </div>
                    <div class="hidden md:flex space-x-1">
                        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-4 py-2 rounded-lg bg-primaryLight font-medium transition">แดชบอร์ด</button>
                        <button onclick="switchTab('search')" id="tab-search" class="px-4 py-2 rounded-lg hover:bg-primaryLight font-medium transition">ค้นหาหนังสือรับ</button>
                        <button onclick="switchTab('completed')" id="tab-completed" class="px-4 py-2 rounded-lg hover:bg-primaryLight font-medium transition">เสร็จสิ้นแล้ว</button>
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="authBtn" onclick="toggleAuth()" class="flex items-center gap-2 bg-white text-primary px-5 py-2 rounded-full font-bold hover:bg-blue-50 transition shadow-lg">
                        <i class="fa-solid fa-user-circle"></i> <span id="authLabel">Guest</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 lg:px-8 py-10 w-full">
        
        <!-- Tab 1: Dashboard -->
        <div id="view-dashboard" class="block animate-fade-in">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-2xl card-shadow border-t-4 border-blue-500">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">หนังสือรับเดือนนี้</p>
                    <h3 id="stat-month" class="text-4xl font-black text-primary mt-2">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl card-shadow border-t-4 border-yellow-500">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">ลงรับแล้ว</p>
                    <h3 id="stat-status1" class="text-4xl font-black text-primary mt-2">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl card-shadow border-t-4 border-indigo-500">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">กำลังเสนอ</p>
                    <h3 id="stat-status2" class="text-4xl font-black text-primary mt-2">0</h3>
                </div>
                <div class="bg-primaryLight p-6 rounded-2xl card-shadow border-t-4 border-accent">
                    <p class="text-xs font-bold text-blue-200 uppercase tracking-wider">เสร็จสิ้น</p>
                    <h3 id="stat-status3" class="text-4xl font-black text-white mt-2">0</h3>
                </div>
            </div>

            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-extrabold text-primary flex items-center gap-3">
                    <span class="w-2 h-8 bg-accent rounded-full"></span> รายการล่าสุด
                </h2>
                <button id="addDocBtn" onclick="openModal()" class="hidden bg-accent hover:bg-yellow-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> ลงรับหนังสือ
                </button>
            </div>

            <div id="dashboard-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <!-- Tab 2: Search -->
        <div id="view-search" class="hidden animate-fade-in">
            <h2 class="text-2xl font-extrabold text-primary mb-8">ค้นหาข้อมูล</h2>
            <div class="bg-white p-2 rounded-2xl shadow-md mb-10 flex gap-2 border border-gray-100">
                <input type="text" id="searchInput" onkeyup="searchDocs()" placeholder="ค้นหาเลขที่หนังสือ, ชื่อเรื่อง, หน่วยงาน..." class="w-full bg-transparent px-6 py-4 outline-none text-lg">
                <div class="bg-primary text-white px-8 flex items-center rounded-xl"><i class="fa-solid fa-search text-xl"></i></div>
            </div>
            <div id="search-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <!-- Tab 3: Completed -->
        <div id="view-completed" class="hidden animate-fade-in">
            <h2 class="text-2xl font-extrabold text-primary mb-8 text-center lg:text-left">คลังเอกสารเสร็จสิ้น</h2>
            <div id="completed-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </main>

    <!-- Modal Login -->
    <div id="loginModal" class="hidden fixed inset-0 bg-primary/60 backdrop-blur-md flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl shadow-2xl p-10 max-w-sm w-full mx-4 text-center">
            <div class="w-20 h-20 bg-blue-50 text-primary rounded-full flex items-center justify-center text-3xl mx-auto mb-6">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3 class="text-2xl font-bold text-primary mb-2">ยืนยันตัวตน</h3>
            <p class="text-gray-500 mb-8">เข้าสู่ระบบ Admin เพื่อจัดการข้อมูล</p>
            <input type="password" id="passwordInput" placeholder="กรอกรหัสผ่าน" class="w-full bg-gray-100 border-none rounded-2xl p-4 text-center text-xl tracking-widest outline-none focus:ring-2 focus:ring-primary mb-6">
            <button onclick="attemptLogin()" class="w-full bg-primary text-white font-bold py-4 rounded-2xl hover:bg-primaryLight transition shadow-lg">ยืนยัน</button>
            <button onclick="closeLoginModal()" class="mt-4 text-gray-400 hover:text-gray-600 font-medium">ยกเลิก</button>
        </div>
    </div>

    <!-- Modal Add/Edit -->
    <div id="docModal" class="hidden fixed inset-0 bg-primary/40 backdrop-blur-sm flex items-center justify-center z-50 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-2xl mx-4 my-10 relative">
            <h3 class="text-2xl font-bold text-primary mb-8 flex items-center gap-3" id="modalTitle">ลงรับหนังสือใหม่</h3>
            <form id="docForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="hidden" id="docId">
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-700 mb-2">เลขรับหนังสือ</label>
                    <input type="text" id="f_receiveNo" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-primary">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-700 mb-2">วันที่ออกหนังสือ</label>
                    <input type="date" id="f_bookDate" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-primary">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-700 mb-2">วันที่รับหนังสือ</label>
                    <input type="date" id="f_receivedDate" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-primary">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-700 mb-2">ส่งจากไหน</label>
                    <input type="text" id="f_fromOrg" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-primary">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">ชื่อเรื่องรับ</label>
                    <input type="text" id="f_subject" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-primary">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-700 mb-2">ผู้รับผิดชอบ</label>
                    <select id="f_owner" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-primary">
                        <option value="">-- เลือกหน่วยงาน --</option>
                        <option value="สำนักปลัด">สำนักปลัด</option>
                        <option value="กองคลัง">กองคลัง</option>
                        <option value="กองช่าง">กองช่าง</option>
                        <option value="กองการศึกษา">กองการศึกษา</option>
                        <option value="นักทรัพย์">นักทรัพย์</option>
                        <option value="นิติกร">นิติกร</option>
                        <option value="งานป้องกัน">งานป้องกัน</option>
                        <option value="งานสภา">งานสภา</option>
                        <option value="ประชาสัมพันธ์">ประชาสัมพันธ์</option>
                        <option value="สาธารณสุข">สาธารณสุข</option>
                        <option value="ธุรการ">ธุรการ</option>
                        <option value="เกษตร">เกษตร</option>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-700 mb-2">รับหนังสือวันที่ (ระบุภายหลังได้)</label>
                    <input type="date" id="f_ownerReceivedDate" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none focus:border-primary">
                </div>
                <div class="md:col-span-2 flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-8 py-3 text-gray-400 font-bold hover:text-gray-600 transition">ยกเลิก</button>
                    <button type="button" onclick="saveDoc()" class="px-10 py-3 bg-primary text-white font-bold rounded-xl shadow-lg hover:bg-primaryLight transition">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyEztWEFdV_dlAWuNQfH-JIVxn5PbmwvoEFJZ5RBPWKnRjoUYbiaksVJkR5OGLGWZr0/exec";
        let isAdmin = false;
        let documents = [];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('passwordInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') attemptLogin(); });
            fetchData();
        });

        async function fetchData() {
            try {
                const res = await fetch(API_URL + "?action=read");
                const data = await res.json();
                documents = data;
                renderAll();
            } catch (e) { console.error("Load error:", e); }
        }

        function toggleAuth() {
            if (isAdmin) { isAdmin = false; updateAuthUI(); } 
            else { document.getElementById('loginModal').classList.remove('hidden'); }
        }

        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

        function attemptLogin() {
            if (document.getElementById('passwordInput').value === 'cp123') {
                isAdmin = true; closeLoginModal(); updateAuthUI();
            } else { alert('รหัสผ่านไม่ถูกต้อง'); }
        }

        function updateAuthUI() {
            const label = document.getElementById('authLabel');
            const addBtn = document.getElementById('addDocBtn');
            label.innerText = isAdmin ? 'Admin' : 'Guest';
            addBtn.classList.toggle('hidden', !isAdmin);
            renderAll();
        }

        function switchTab(target) {
            ['dashboard', 'search', 'completed'].forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== target);
                document.getElementById(`tab-${t}`).classList.toggle('bg-primaryLight', t === target);
            });
            renderAll();
        }

        function openModal(id = null) {
            document.getElementById('docModal').classList.remove('hidden');
            if (id) {
                const d = documents.find(x => x.id === id);
                document.getElementById('docId').value = d.id;
                document.getElementById('f_receiveNo').value = d.receiveNo || '';
                document.getElementById('f_bookDate').value = d.bookDate || '';
                document.getElementById('f_receivedDate').value = d.receivedDate || '';
                document.getElementById('f_fromOrg').value = d.fromOrg || '';
                document.getElementById('f_subject').value = d.subject || '';
                document.getElementById('f_owner').value = d.owner || '';
                document.getElementById('f_ownerReceivedDate').value = d.ownerReceivedDate || '';
            } else {
                document.getElementById('docForm').reset();
                document.getElementById('docId').value = '';
            }
        }

        function closeModal() { document.getElementById('docModal').classList.add('hidden'); }

        async function saveDoc() {
            const doc = {
                id: document.getElementById('docId').value || 'ID-' + Date.now(),
                receiveNo: document.getElementById('f_receiveNo').value,
                bookDate: document.getElementById('f_bookDate').value,
                receivedDate: document.getElementById('f_receivedDate').value,
                fromOrg: document.getElementById('f_fromOrg').value,
                subject: document.getElementById('f_subject').value,
                owner: document.getElementById('f_owner').value,
                ownerReceivedDate: document.getElementById('f_ownerReceivedDate').value,
                status: document.getElementById('docId').value ? documents.find(x => x.id === document.getElementById('docId').value).status : "ลงรับแล้ว"
            };

            // แสดงใน UI ทันที
            const idx = documents.findIndex(x => x.id === doc.id);
            if (idx > -1) documents[idx] = doc; else documents.unshift(doc);
            renderAll();
            closeModal();

            // ส่งไป GAS
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: document.getElementById('docId').value ? 'update' : 'create', data: doc })
            });
        }

        async function updateStatus(id, newStatus) {
            const d = documents.find(x => x.id === id);
            d.status = newStatus;
            renderAll();
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'updateStatus', id: id, status: newStatus })
            });
        }

        async function deleteDoc(id) {
            if (!confirm('ยืนยันการลบหนังสือนี้?')) return;
            documents = documents.filter(x => x.id !== id);
            renderAll();
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'delete', id: id })
            });
        }

        function renderAll() {
            const statusMap = { "ลงรับแล้ว": 1, "กำลังเสนอ": 2, "เสร็จสิ้น": 3 };
            updateStats();
            renderCards(documents.filter(x => x.status !== "เสร็จสิ้น"), 'dashboard-cards');
            renderCards(documents.filter(x => x.status === "เสร็จสิ้น"), 'completed-cards');
        }

        function updateStats() {
            const currentMonth = new Date().getMonth();
            document.getElementById('stat-month').innerText = documents.filter(x => x.receivedDate && new Date(x.receivedDate).getMonth() === currentMonth).length;
            document.getElementById('stat-status1').innerText = documents.filter(x => x.status === "ลงรับแล้ว").length;
            document.getElementById('stat-status2').innerText = documents.filter(x => x.status === "กำลังเสนอ").length;
            document.getElementById('stat-status3').innerText = documents.filter(x => x.status === "เสร็จสิ้น").length;
        }

        function searchDocs() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = documents.filter(x => x.subject.toLowerCase().includes(q) || x.receiveNo.toLowerCase().includes(q) || x.fromOrg.toLowerCase().includes(q));
            renderCards(filtered, 'search-cards');
        }

        function renderCards(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const statusMap = { "ลงรับแล้ว": 1, "กำลังเสนอ": 2, "เสร็จสิ้น": 3 };
            const statusList = ["ลงรับแล้ว", "กำลังเสนอ", "เสร็จสิ้น"];

            list.forEach(d => {
                const currentStep = statusMap[d.status] || 1;
                const progressWidth = ((currentStep - 1) / 2) * 100 + '%';

                container.innerHTML += `
                <div class="bg-white rounded-3xl p-6 card-shadow border border-gray-50 flex flex-col h-full relative">
                    ${isAdmin ? `
                        <div class="absolute top-4 right-4 flex gap-3 text-gray-300">
                            <button onclick="openModal('${d.id}')" class="hover:text-blue-500"><i class="fa-solid fa-edit"></i></button>
                            <button onclick="deleteDoc('${d.id}')" class="hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    ` : ''}
                    <div class="mb-4">
                        <span class="text-[10px] font-black bg-blue-50 text-primaryLight px-2 py-1 rounded-md uppercase tracking-tighter border border-blue-100">เลขรับ: ${d.receiveNo || '-'}</span>
                        <h4 class="text-lg font-bold text-gray-800 mt-3 leading-tight line-clamp-2">${d.subject || 'ไม่ระบุชื่อเรื่อง'}</h4>
                    </div>
                    <div class="text-sm text-gray-500 space-y-2 flex-grow">
                        <p><i class="fa-solid fa-building w-5 text-gray-300"></i> จาก: <span class="text-gray-700 font-medium">${d.fromOrg || '-'}</span></p>
                        <p><i class="fa-solid fa-calendar w-5 text-gray-300"></i> รับเมื่อ: <span class="text-gray-700 font-medium">${d.receivedDate || '-'}</span></p>
                        <p><i class="fa-solid fa-user w-5 text-gray-300"></i> ผู้รับ: <span class="text-gray-700 font-medium">${d.owner || '-'}</span></p>
                    </div>
                    
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${progressWidth}"></div>
                        ${statusList.map((s, i) => `
                            <div class="step-dot ${currentStep >= i+1 ? 'active' : ''}" style="left: ${i * 50}%"></div>
                            <div class="step-label ${currentStep >= i+1 ? 'active' : ''}" style="left: ${i * 50}%">${s}</div>
                        `).join('')}
                    </div>

                    ${isAdmin && d.status !== "เสร็จสิ้น" ? `
                        <div class="flex justify-between mt-4">
                            <button onclick="updateStatus('${d.id}', '${statusList[currentStep-2]}')" class="text-xs font-bold text-gray-400 hover:text-gray-600 ${currentStep===1?'invisible':''}">ย้อนกลับ</button>
                            <button onclick="updateStatus('${d.id}', '${statusList[currentStep]}')" class="bg-primary text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-primaryLight transition shadow-md">ถัดไป <i class="fa-solid fa-arrow-right ml-1"></i></button>
                        </div>
                    ` : ''}
                </div>`;
            });
        }
    </script>
</body>
</html>
