<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARABAN CPP</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
body{font-family:'Prompt',sans-serif;background:#f1f5f9}
</style>
</head>

<body>

<!-- TOP -->
<div class="bg-[#0F172A] text-white p-4 flex justify-between items-center">
  <h1 class="font-bold text-lg">SARABAN CPP</h1>

  <!-- ❌ ไม่มี export แล้ว -->
  <button onclick="login()" class="bg-white text-black px-4 py-2 rounded-xl font-bold">
    Admin
  </button>
</div>

<div class="p-4 max-w-7xl mx-auto">

  <!-- STATS -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

    <div class="bg-blue-500 text-white p-4 rounded-xl">
      <p>ทั้งหมด</p>
      <h2 id="total">0</h2>
    </div>

    <div class="bg-green-500 text-white p-4 rounded-xl">
      <p>ลงรับ</p>
      <h2 id="received">0</h2>
    </div>

    <div class="bg-orange-500 text-white p-4 rounded-xl">
      <p>เสนอ</p>
      <h2 id="process">0</h2>
    </div>

    <div class="bg-purple-500 text-white p-4 rounded-xl">
      <p>เสร็จ</p>
      <h2 id="done">0</h2>
    </div>

  </div>

  <!-- SEARCH -->
  <input id="search" onkeyup="renderAll()" placeholder="ค้นหา..."
    class="w-full p-4 rounded-xl mb-6 border">

  <!-- TABLE -->
  <div class="bg-white rounded-xl shadow overflow-x-auto">

    <table class="w-full text-sm">

      <thead class="bg-gray-100 text-gray-600">
        <tr>
          <th class="p-3 text-left">เลขรับ</th>
          <th class="p-3 text-left">เรื่อง</th>
          <th class="p-3 text-left">จาก</th>
          <th class="p-3 text-left">วันที่ออก</th>
          <th class="p-3 text-left">วันที่รับ</th>
          <th class="p-3 text-left">สถานะ</th>
          <th class="p-3 text-left">กอง</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyGa_dNlU6HQTbRYHL5qvY0U3og8US0VCJMsEK6SaBm8U7onG7SzkrhZurYZ6H1rsFV/exec";

let documents = [];
let isAdmin = false;

function login(){
  const pass = prompt("ใส่รหัส");
  if(pass === "123456"){
    isAdmin = true;
    alert("เข้าโหมด Admin");
  }else{
    alert("รหัสผิด");
  }
}

function formatDate(d){
  if(!d) return "-";
  return new Date(d).toLocaleDateString('th-TH');
}

function renderStatus(status){
  if(status==="ลงรับแล้ว") return `<span class="px-3 py-1 bg-blue-100 text-blue-600 rounded-full">ลงรับแล้ว</span>`;
  if(status==="กำลังเสนอ") return `<span class="px-3 py-1 bg-orange-100 text-orange-600 rounded-full">กำลังเสนอ</span>`;
  if(status==="เสร็จสิ้น") return `<span class="px-3 py-1 bg-green-100 text-green-600 rounded-full">เสร็จสิ้น</span>`;
  return `<span class="px-3 py-1 bg-gray-100 text-gray-500 rounded-full">-</span>`;
}

function renderTable(list){
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  list.forEach(d=>{
    tbody.innerHTML += `
    <tr class="border-b hover:bg-gray-50">

      <td class="p-3 font-bold">${d.receiveNo2 || '-'}</td>

      <!-- 🔥 รวมเลขหนังสือ + เรื่อง -->
      <td class="p-3">
        <div class="text-xs text-gray-400">${d.receiveNo || ''}</div>
        <div class="font-semibold">${d.subject || '-'}</div>
      </td>

      <td class="p-3">${d.fromOrg || '-'}</td>
      <td class="p-3">${formatDate(d.bookDate)}</td>
      <td class="p-3">${formatDate(d.receivedDate)}</td>
      <td class="p-3">${renderStatus(d.status)}</td>
      <td class="p-3">${d.owner || '-'}</td>

    </tr>
    `;
  });
}

function renderStats(list){
  document.getElementById("total").innerText = list.length;
  document.getElementById("received").innerText = list.filter(x=>x.status==="ลงรับแล้ว").length;
  document.getElementById("process").innerText = list.filter(x=>x.status==="กำลังเสนอ").length;
  document.getElementById("done").innerText = list.filter(x=>x.status==="เสร็จสิ้น").length;
}

function renderAll(){
  const q = document.getElementById("search").value.toLowerCase();

  let filtered = documents.filter(d=>{
    const text = `${d.receiveNo2} ${d.receiveNo} ${d.subject} ${d.fromOrg}`.toLowerCase();
    return text.includes(q);
  });

  renderStats(filtered);
  renderTable(filtered);
}

async function fetchData(){
  const res = await fetch(API_URL+"?action=read");
  const data = await res.json();

  // 🔥 เรียงเลขรับจากน้อยไปมาก
  documents = data.sort((a,b)=>{
    return (parseInt(a.receiveNo2)||0)-(parseInt(b.receiveNo2)||0);
  });

  renderAll();
}

fetchData();

</script>

</body>
</html>
