<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SARABAN CPP</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{font-family:'Prompt';background:#f1f5f9;}
.status{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:bold;}
</style>

</head>

<body>

<!-- HEADER -->
<div class="bg-[#0F172A] text-white p-4 flex justify-between items-center">
<h1 class="font-bold">📄 SARABAN CPP</h1>

<div class="flex gap-2">
<button onclick="exportExcel()" class="bg-green-500 px-3 py-1 rounded text-sm">Export</button>
<button onclick="login()" class="bg-white text-black px-3 py-1 rounded text-sm">Admin</button>
</div>

</div>

<div class="max-w-7xl mx-auto p-6">

<!-- STATS -->
<div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

<!-- SEARCH -->
<input id="search" placeholder="ค้นหา..."
class="w-full p-4 rounded-xl border mb-6">

<!-- TABLE -->
<div class="bg-white rounded-xl shadow overflow-x-auto">

<table class="w-full text-sm">

<thead class="bg-gray-100 text-gray-600">
<tr>
<th class="p-3">เลขรับ</th>
<th class="p-3">เลขหนังสือ</th>
<th class="p-3">วันที่ออก</th>
<th class="p-3">เรื่อง</th>
<th class="p-3">จาก</th>
<th class="p-3">วันที่ลงรับ</th>
<th class="p-3">สถานะ</th>
<th class="p-3">กอง</th>
<th id="adminCol" class="p-3 hidden">จัดการ</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbyGa_dNlU6HQTbRYHL5qvY0U3og8US0VCJMsEK6SaBm8U7onG7SzkrhZurYZ6H1rsFV/exec";

let docs=[];
let isAdmin=false;

/* LOAD */
async function load(){
let res=await fetch(API+"?action=read");
docs=await res.json();

// เรียงเลขรับ
docs.sort((a,b)=>(parseInt(a.receiveNo2)||0)-(parseInt(b.receiveNo2)||0));

render(docs);
}

/* RENDER */
function render(data){

// STATS
stats.innerHTML=`
<div class="bg-blue-500 text-white p-4 rounded-xl">ทั้งหมด ${data.length}</div>
<div class="bg-green-500 text-white p-4 rounded-xl">ลงรับ ${count('ลงรับแล้ว')}</div>
<div class="bg-orange-500 text-white p-4 rounded-xl">เสนอ ${count('กำลังเสนอ')}</div>
<div class="bg-purple-500 text-white p-4 rounded-xl">เสร็จ ${count('เสร็จสิ้น')}</div>
`;

table.innerHTML=data.map(d=>`
<tr class="border-b hover:bg-gray-50">

<td class="p-3 font-bold">${d.receiveNo2||'-'}</td>
<td class="p-3">${d.receiveNo||'-'}</td>
<td class="p-3">${date(d.bookDate)}</td>
<td class="p-3 font-semibold">${d.subject}</td>
<td class="p-3">${d.fromOrg||'-'}</td>
<td class="p-3">${date(d.receivedDate)}</td>
<td class="p-3">${badge(d.status)}</td>
<td class="p-3">${d.owner||'-'}</td>

${isAdmin ? `
<td class="p-3 flex gap-2">
<button onclick="edit('${d.id}')" class="text-blue-500">✏️</button>
<button onclick="del('${d.id}')" class="text-red-500">🗑️</button>
<button onclick="next('${d.id}')" class="text-green-500">➡️</button>
</td>`:''}

</tr>
`).join('');

}

/* STATUS COUNT */
function count(s){
return docs.filter(d=>d.status===s).length;
}

/* STATUS COLOR */
function badge(s){
if(s==="ลงรับแล้ว") return `<span class="status bg-blue-100 text-blue-600">${s}</span>`;
if(s==="กำลังเสนอ") return `<span class="status bg-orange-100 text-orange-600">${s}</span>`;
if(s==="เสร็จสิ้น") return `<span class="status bg-green-100 text-green-600">${s}</span>`;
return s;
}

/* DATE */
function date(d){
if(!d) return '-';
return new Date(d).toLocaleDateString('th-TH');
}

/* SEARCH */
search.onkeyup=function(){
let q=this.value.toLowerCase();
render(docs.filter(d=>
`${d.receiveNo2} ${d.subject} ${d.fromOrg}`.toLowerCase().includes(q)
));
}

/* ADMIN LOGIN */
function login(){
let p=prompt("รหัส:");
if(p==="123456"){
isAdmin=true;
adminCol.classList.remove("hidden");
render(docs);
}
}

/* NEXT STATUS */
async function next(id){
let d=docs.find(x=>x.id===id);
let nextStatus="เสร็จสิ้น";

if(d.status==="ลงรับแล้ว") nextStatus="กำลังเสนอ";
else if(d.status==="กำลังเสนอ") nextStatus="เสร็จสิ้น";

await fetch(API,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({action:"updateStatus",id,status:nextStatus})
});
load();
}

/* DELETE */
async function del(id){
if(!confirm("ลบ?")) return;

await fetch(API,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({action:"delete",id})
});
load();
}

/* EDIT */
function edit(id){
let d=docs.find(x=>x.id===id);

let subject=prompt("เรื่อง:",d.subject);
if(!subject) return;

fetch(API,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({
action:"update",
data:{...d,subject}
})
});
load();
}

/* EXPORT */
function exportExcel(){

let csv="เลขรับ,เลขหนังสือ,วันที่ออก,เรื่อง,จาก,วันที่รับ,สถานะ,กอง\n";

docs.forEach(d=>{
csv+=`${d.receiveNo2},${d.receiveNo},${d.bookDate},${d.subject},${d.fromOrg},${d.receivedDate},${d.status},${d.owner}\n`;
});

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="saraban.csv";
a.click();

}

load();

</script>

</body>
</html>
