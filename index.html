<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saraban Champakpaew</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#eef6ff;
--white:#ffffff;
--primary:#0f5f9f;
--primary2:#1d8bd8;
--dark:#163b63;
--text:#294861;
--line:#d7e8f7;
--success:#16a34a;
--warning:#f59e0b;
--shadow:0 12px 28px rgba(15,95,159,.12);
--radius:24px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Prompt',sans-serif;
background:linear-gradient(135deg,#eef7ff,#f8fbff);
color:var(--text);
}

header{
position:sticky;
top:0;
z-index:100;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
padding:16px 22px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--line);
}

.logo{
font-size:24px;
font-weight:700;
color:var(--primary);
}

.admin-area{
display:flex;
gap:10px;
align-items:center;
}

.admin-btn,
.login-btn,
.logout-btn{
border:none;
padding:11px 18px;
border-radius:999px;
font-family:inherit;
font-weight:600;
cursor:pointer;
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:white;
box-shadow:0 8px 20px rgba(29,139,216,.2);
}

.logout-btn{
background:#64748b;
display:none;
}

#passwordInput{
display:none;
padding:11px 15px;
border-radius:999px;
border:1px solid var(--line);
font-family:inherit;
outline:none;
}

.container{
max-width:1250px;
margin:auto;
padding:24px;
}

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-bottom:20px;
}

.tab{
border:none;
padding:15px;
border-radius:18px;
background:white;
cursor:pointer;
font-family:inherit;
font-weight:600;
color:var(--dark);
border:1px solid var(--line);
box-shadow:var(--shadow);
}

.tab.active{
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:white;
}

.page{
display:none;
}

.page.active{
display:block;
}

.hero{
background:linear-gradient(135deg,var(--primary),var(--primary2));
padding:30px;
border-radius:32px;
color:white;
margin-bottom:22px;
box-shadow:var(--shadow);
}

.hero h1{
font-size:32px;
margin-bottom:5px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
margin-bottom:24px;
}

.stat{
background:white;
padding:22px;
border-radius:var(--radius);
box-shadow:var(--shadow);
border:1px solid var(--line);
}

.stat-title{
font-size:14px;
color:#6b7c8f;
margin-bottom:10px;
}

.stat-number{
font-size:38px;
font-weight:700;
color:var(--primary);
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
gap:12px;
flex-wrap:wrap;
}

.topbar h2{
color:var(--dark);
}

.add-btn{
display:none;
border:none;
padding:13px 18px;
border-radius:18px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:white;
font-family:inherit;
font-weight:700;
cursor:pointer;
box-shadow:var(--shadow);
}

.search-box{
width:100%;
max-width:420px;
padding:14px 16px;
border-radius:18px;
border:1px solid var(--line);
font-family:inherit;
outline:none;
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}

.date-group{
grid-column:1/-1;
background:linear-gradient(135deg,#12385c,#0f5f9f);
padding:14px 18px;
border-radius:18px;
color:white;
font-weight:700;
}

.card{
background:white;
border-radius:var(--radius);
padding:20px;
border:1px solid var(--line);
border-left:8px solid var(--primary2);
box-shadow:var(--shadow);
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
gap:10px;
}

.receive-no{
font-size:19px;
font-weight:700;
color:var(--primary);
}

.badge{
padding:8px 13px;
border-radius:999px;
font-size:13px;
font-weight:600;
color:white;
}

.s1{background:#2563eb;}
.s2{background:#f59e0b;}
.s3{background:#16a34a;}

.subject{
font-size:18px;
font-weight:700;
margin-bottom:14px;
line-height:1.6;
color:var(--dark);
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.info div{
background:#f5faff;
padding:10px;
border-radius:14px;
border:1px solid #e5eff9;
font-size:14px;
}

.info b{
color:var(--primary);
}

.status-buttons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:16px;
}

.status-buttons button{
border:none;
padding:10px;
border-radius:14px;
font-family:inherit;
font-weight:600;
cursor:pointer;
background:#e8f2ff;
color:var(--dark);
}

.status-buttons button.active{
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:white;
}

.empty{
grid-column:1/-1;
background:white;
padding:35px;
text-align:center;
border-radius:var(--radius);
border:1px dashed #b8d5ef;
color:#718096;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:999;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-box{
width:100%;
max-width:760px;
background:white;
border-radius:30px;
padding:24px;
max-height:90vh;
overflow:auto;
}

.modal-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.modal-header h2{
color:var(--primary);
}

.close-btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
background:#eef5ff;
cursor:pointer;
font-size:20px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.form-grid label{
font-size:14px;
font-weight:600;
color:var(--dark);
}

.form-grid input,
.form-grid select,
.form-grid textarea{
margin-top:6px;
width:100%;
padding:13px;
border-radius:14px;
border:1px solid var(--line);
font-family:inherit;
outline:none;
background:#fbfdff;
}

textarea{
resize:vertical;
min-height:90px;
}

.full{
grid-column:1/-1;
}

.save-btn{
margin-top:18px;
width:100%;
padding:14px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:white;
font-family:inherit;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.toast{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
background:#12385c;
color:white;
padding:12px 18px;
border-radius:999px;
display:none;
z-index:9999;
}

@media(max-width:900px){
.cards,
.stats,
.tabs,
.info,
.form-grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<div class="logo">Saraban Champakpaew</div>

<div class="admin-area">
<button class="admin-btn" id="modeBtn" onclick="showLogin()">Guest</button>

<input type="password" id="passwordInput" placeholder="รหัส Admin">

<button class="login-btn" id="loginBtn" style="display:none;" onclick="login()">เข้าสู่ระบบ</button>

<button class="logout-btn" id="logoutBtn" onclick="logout()">ออกจากระบบ</button>
</div>
</header>

<div class="container">

<div class="tabs">
<button class="tab active" onclick="showPage('dashboard',this)">หน้าแดชบอร์ด</button>
<button class="tab" onclick="showPage('search',this)">ค้นหาหนังสือรับ</button>
<button class="tab" onclick="showPage('done',this)">หนังสือรับที่เสร็จสิ้นแล้ว</button>
</div>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">

<div class="hero">
<h1>ระบบสารบัญทะเบียนหนังสือรับ</h1>
<p>องค์การบริหารส่วนตำบลชำผักแพว</p>
</div>

<div class="stats">
<div class="stat">
<div class="stat-title">จำนวนหนังสือรับในเดือนนี้</div>
<div class="stat-number" id="statMonth">0</div>
</div>

<div class="stat">
<div class="stat-title">ลงรับแล้ว</div>
<div class="stat-number" id="statReceive">0</div>
</div>

<div class="stat">
<div class="stat-title">กำลังเสนอ</div>
<div class="stat-number" id="statOffer">0</div>
</div>

<div class="stat">
<div class="stat-title">เสร็จสิ้น</div>
<div class="stat-number" id="statDone">0</div>
</div>
</div>

<div class="topbar">
<h2>รายการหนังสือรับล่าสุด</h2>
<button class="add-btn" id="addBtn" onclick="openModal()">+ เพิ่มหนังสือรับ</button>
</div>

<div class="cards" id="dashboardCards"></div>

</section>

<!-- SEARCH -->
<section id="search" class="page">

<div class="topbar">
<h2>ค้นหาหนังสือรับ</h2>

<input type="text" class="search-box" id="searchInput" placeholder="ค้นหาเลขรับ / เรื่อง / ผู้รับผิดชอบ" oninput="renderAll()">
</div>

<div class="cards" id="searchCards"></div>

</section>

<!-- DONE -->
<section id="done" class="page">

<div class="topbar">
<h2>หนังสือรับที่เสร็จสิ้นแล้ว</h2>
</div>

<div class="cards" id="doneCards"></div>

</section>

</div>

<!-- MODAL -->
<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-header">
<h2>เพิ่มข้อมูลหนังสือรับ</h2>
<button class="close-btn" onclick="closeModal()">×</button>
</div>

<form id="docForm">

<div class="form-grid">

<label>
เลขรับหนังสือ
<input required id="receiveNo">
</label>

<label>
วันที่ออกหนังสือ
<input type="date" required id="bookDate">
</label>

<label>
วันที่รับหนังสือ
<input type="date" required id="receiveDate">
</label>

<label>
ส่งจากไหน
<input required id="fromOrg">
</label>

<label class="full">
ชื่อเรื่องรับ
<textarea required id="subject"></textarea>
</label>

<label>
ผู้รับผิดชอบ
<select required id="owner">
<option value="">เลือกผู้รับผิดชอบ</option>
<option>สำนักปลัด</option>
<option>กองคลัง</option>
<option>กองช่าง</option>
<option>กองการศึกษา</option>
<option>นักทรัพย์</option>
<option>นิติกร</option>
<option>งานป้องกัน</option>
<option>งานสภา</option>
<option>ประชาสัมพันธ์</option>
<option>นักจัดการ</option>
<option>สาธารณสุข</option>
<option>สปสช</option>
<option>ตรวจสอบภายใน</option>
<option>ธุรการ</option>
<option>เกษตร</option>
<option>สิ่งแวดล้อม</option>
</select>
</label>

<label>
ผู้รับผิดชอบได้รับหนังสือวันที่
<input type="date" id="ownerReceiveDate">
</label>

</div>

<button class="save-btn" type="submit">บันทึกข้อมูล</button>

</form>

</div>
</div>

<div class="toast" id="toast"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwgRWvji7Cz0gyM6IU2DVrvdhj7IPv7eThudN4x-sbc7q-Wqf76_xeR8kwp7gRVJeSg/exec";

const PASSWORD = "cp123";

let documents = [];
let isAdmin = false;

const statuses = ["ลงรับแล้ว","กำลังเสนอ","เสร็จสิ้น"];

document.addEventListener("DOMContentLoaded",loadData);

function showLogin(){
if(isAdmin) return;

document.getElementById("passwordInput").style.display="block";
document.getElementById("loginBtn").style.display="block";
}

function login(){

const pass=document.getElementById("passwordInput").value;

if(pass===PASSWORD){

isAdmin=true;

document.getElementById("modeBtn").innerText="Admin";

document.getElementById("logoutBtn").style.display="block";

document.getElementById("addBtn").style.display="block";

document.getElementById("passwordInput").style.display="none";

document.getElementById("loginBtn").style.display="none";

toast("เข้าสู่ระบบ Admin สำเร็จ");

renderAll();

}else{
toast("รหัสไม่ถูกต้อง");
}
}

function logout(){

isAdmin=false;

document.getElementById("modeBtn").innerText="Guest";

document.getElementById("logoutBtn").style.display="none";

document.getElementById("addBtn").style.display="none";

toast("ออกจากระบบแล้ว");

renderAll();
}

function showPage(id,btn){

document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

document.getElementById(id).classList.add("active");
btn.classList.add("active");

renderAll();
}

async function loadData(){

try{

const res=await fetch(API_URL+"?action=read");

documents=await res.json();

renderAll();

}catch(err){

toast("โหลดข้อมูลไม่สำเร็จ");

}
}

document.getElementById("docForm").addEventListener("submit",saveData);

async function saveData(e){

e.preventDefault();

const item={

id:Date.now().toString(),

receiveNo:value("receiveNo"),

bookDate:value("bookDate"),

receiveDate:value("receiveDate"),

fromOrg:value("fromOrg"),

subject:value("subject"),

owner:value("owner"),

ownerReceiveDate:value("ownerReceiveDate"),

status:"ลงรับแล้ว",

createdAt:new Date().toISOString()

};

try{

await fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"create",
data:item
})
});

documents.unshift(item);

closeModal();

document.getElementById("docForm").reset();

toast("บันทึกข้อมูลสำเร็จ");

renderAll();

}catch(err){

toast("บันทึกข้อมูลไม่สำเร็จ");

}
}

async function updateStatus(id,status){

if(!isAdmin){
toast("กรุณาเข้าสู่ระบบ Admin");
return;
}

const item=documents.find(x=>x.id===id);

if(!item) return;

item.status=status;

try{

await fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"updateStatus",
id,
status
})
});

toast("อัปเดตสถานะแล้ว");

renderAll();

}catch(err){

toast("อัปเดตไม่สำเร็จ");

}
}

function renderAll(){

renderStats();

renderCards(
"dashboardCards",
documents.filter(d=>d.status!=="เสร็จสิ้น"),
true
);

const q=document.getElementById("searchInput").value.toLowerCase();

renderCards(
"searchCards",
documents.filter(d=>
`${d.receiveNo} ${d.subject} ${d.owner} ${d.fromOrg}`
.toLowerCase()
.includes(q)
),
true
);

renderCards(
"doneCards",
documents.filter(d=>d.status==="เสร็จสิ้น"),
false
);
}

function renderStats(){

const now=new Date();

const monthDocs=documents.filter(d=>{

const dt=new Date(d.receiveDate);

return dt.getMonth()===now.getMonth()
&& dt.getFullYear()===now.getFullYear();

});

document.getElementById("statMonth").innerText=monthDocs.length;

document.getElementById("statReceive").innerText=
monthDocs.filter(d=>d.status==="ลงรับแล้ว").length;

document.getElementById("statOffer").innerText=
monthDocs.filter(d=>d.status==="กำลังเสนอ").length;

document.getElementById("statDone").innerText=
monthDocs.filter(d=>d.status==="เสร็จสิ้น").length;
}

function renderCards(target,list,showButtons){

const box=document.getElementById(target);

box.innerHTML="";

if(list.length===0){

box.innerHTML=`<div class="empty">ยังไม่มีข้อมูล</div>`;

return;
}

list.sort((a,b)=>
new Date(b.receiveDate)-new Date(a.receiveDate)
);

let lastDate="";

list.forEach(d=>{

const date=formatDate(d.receiveDate);

if(date!==lastDate){

lastDate=date;

box.innerHTML+=`
<div class="date-group">
วันที่รับหนังสือ ${date}
</div>
`;
}

const badgeClass=
d.status==="ลงรับแล้ว" ? "s1" :
d.status==="กำลังเสนอ" ? "s2" : "s3";

box.innerHTML+=`

<div class="card">

<div class="card-top">

<div class="receive-no">
เลขรับ ${d.receiveNo}
</div>

<div class="badge ${badgeClass}">
${d.status}
</div>

</div>

<div class="subject">
${d.subject}
</div>

<div class="info">

<div>
<b>วันที่ออกหนังสือ</b><br>
${formatDate(d.bookDate)}
</div>

<div>
<b>วันที่รับหนังสือ</b><br>
${formatDate(d.receiveDate)}
</div>

<div>
<b>ส่งจาก</b><br>
${d.fromOrg}
</div>

<div>
<b>ผู้รับผิดชอบ</b><br>
${d.owner}
</div>

<div>
<b>ได้รับหนังสือวันที่</b><br>
${d.ownerReceiveDate ? formatDate(d.ownerReceiveDate) : "-"}
</div>

<div>
<b>สถานะ</b><br>
${d.status}
</div>

</div>

${showButtons ? `

<div class="status-buttons">

${statuses.map(s=>`

<button
onclick="updateStatus('${d.id}','${s}')"
class="${d.status===s ? 'active':''}"
${!isAdmin ? 'disabled' : ''}
>
${s}
</button>

`).join("")}

</div>

`:""}

</div>

`;

});
}

function openModal(){

if(!isAdmin){
toast("กรุณาเข้าสู่ระบบ Admin");
return;
}

document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function value(id){
return document.getElementById(id).value.trim();
}

function formatDate(date){

if(!date) return "-";

const d=new Date(date);

return d.toLocaleDateString("th-TH",{
year:"numeric",
month:"long",
day:"numeric"
});
}

function toast(msg){

const t=document.getElementById("toast");

t.innerText=msg;

t.style.display="block";

setTimeout(()=>{
t.style.display="none";
},2500);
}

</script>

</body>
</html>
