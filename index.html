<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARABAN CPP | อบต.ชำผักแพว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0F172A', gold: '#D4AF37' } } } }
    </script>
    <style>
        body { background: #f1f5f9; font-family: 'Prompt', sans-serif; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 28px; transition: 0.3s; position: relative; }
        .glass-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1); }
        .btn-tab { padding: 14px 28px; border-radius: 16px; font-weight: 700; font-size: 15px; transition: 0.2s; }
        .progress-wrapper { position: relative; padding: 10px 0 25px; margin-top: 25px; border-top: 1px solid #f1f5f9; }
        .progress-line-bg { height: 4px; background: #e2e8f0; border-radius: 10px; position: relative; margin: 0 15px; }
        .progress-line-fill { position: absolute; height: 100%; background: #0F172A; border-radius: 10px; transition: 0.5s; }
        .status-steps { display: flex; justify-content: space-between; position: absolute; width: 100%; top: 4px; left: 0; }
        .step-item { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .step-dot { width: 12px; height: 12px; border-radius: 50%; background: white; border: 2px solid #cbd5e1; z-index: 10; margin-bottom: 8px; transition: 0.3s; }
        .step-item.active .step-dot { background: #0F172A; border-color: #0F172A; }
        .step-label { font-size: 10px; font-weight: 700; color: #94a3b8; white-space: nowrap; }
        .step-item.active .step-label { color: #0F172A; }
        /* Calendar Styles */
        .cal-day { min-height: 100px; border: 1px solid #f1f5f9; transition: 0.2s; cursor: pointer; }
        .cal-day:hover { background: #f8fafc; }
        .cal-today { background: #eff6ff; border: 2px solid #3b82f6; }
        .cal-badge { background: #0F172A; color: white; padding: 2px 6px; border-radius: 6px; font-size: 11px; }
    </style>
</head>
<body class="antialiased">

    <nav class="bg-primary text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-3">
            <div class="bg-gold p-2 rounded-xl text-primary shadow-lg"><i class="fa-solid fa-file-invoice"></i></div>
            <span class="font-bold tracking-tight text-lg uppercase">Saraban CPP</span>
        </div>
        <button id="authBtn" onclick="toggleAuth()" class="bg-white text-primary px-6 py-2 rounded-full text-xs font-bold shadow-lg transition-all hover:bg-gold hover:text-white">
            <i class="fa-solid fa-user-shield mr-2"></i><span id="authLabel">GUEST MODE</span>
        </button>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="stats-area" class="grid grid-cols-2 lg:grid-cols-4 gap-5 mb-8"></div>

        <div class="flex flex-wrap gap-3 mb-4 bg-white/40 backdrop-blur p-2.5 rounded-[24px] border border-white shadow-sm">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="btn-tab bg-primary text-white flex-1 transition shadow-lg font-bold">หน้าแรก</button>
            <button onclick="switchTab('by-owner')" id="tab-by-owner" class="btn-tab bg-white text-gray-400 hover:bg-gray-50 flex-1 transition shadow-sm font-bold">สถิติแยกกองงาน</button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="btn-tab bg-white text-gray-400 hover:bg-gray-50 flex-1 transition shadow-sm font-bold">ปฏิทินงานรับ</button>
            <button id="addDocBtn" onclick="openModal()" class="hidden bg-gold text-primary btn-tab shadow-lg transition font-black ml-auto"><i class="fa-solid fa-plus-circle mr-2"></i>ลงรับหนังสือใหม่</button>
        </div>

        <div id="view-dashboard" class="block"><div id="dashboard-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div></div>
        
        <div id="view-by-owner" class="hidden">
            <div class="bg-white p-8 rounded-[35px] shadow-sm mb-8 border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="font-black text-primary uppercase text-sm">เลือกกองงานที่ต้องการตรวจสอบ</div>
                <select id="ownerFilter" onchange="renderByOwner()" class="bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl outline-none font-bold w-full md:w-80">
                    <option value="">-- เลือกกองงาน --</option>
                    <option value="สำนักปลัด">สำนักปลัด</option><option value="กองคลัง">กองคลัง</option><option value="กองช่าง">กองช่าง</option><option value="กองการศึกษา">กองการศึกษา</option><option value="นักทรัพย์">นักทรัพย์</option><option value="นิติกร">นิติกร</option><option value="งานป้องกัน">งานป้องกัน</option><option value="งานสภา">งานสภา</option><option value="ประชาสัมพันธ์">ประชาสัมพันธ์</option><option value="นักจัดการ">นักจัดการ</option><option value="สาธารณสุข">สาธารณสุข</option><option value="สปสช">สปสช</option><option value="ตรวจสอบภายใน">ตรวจสอบภายใน</option><option value="ธุรการ">ธุรการ</option><option value="เกษตร">เกษตร</option><option value="สิ่งแวดล้อม">สิ่งแวดล้อม</option>
                </select>
            </div>
            <div id="owner-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <div id="view-calendar" class="hidden">
            <div class="bg-white p-8 rounded-[35px] shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-8">
                    <h2 id="monthDisplay" class="text-2xl font-black text-primary uppercase italic">ปฏิทินเดือนนี้</h2>
                    <div class="flex gap-2">
                        <button onclick="changeMonth(-1)" class="p-3 bg-gray-100 rounded-xl hover:bg-primary hover:text-white transition"><i class="fa-solid fa-chevron-left"></i></button>
                        <button onclick="changeMonth(1)" class="p-3 bg-gray-100 rounded-xl hover:bg-primary hover:text-white transition"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 text-center font-black text-gray-400 text-[10px] mb-4 uppercase tracking-widest">
                    <div>อา.</div><div>จ.</div><div>อ.</div><div>พ.</div><div>พฤ.</div><div>ศ.</div><div>ส.</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 border border-gray-50 rounded-2xl overflow-hidden shadow-inner"></div>
            </div>
        </div>
    </main>

    <div id="dayModal" class="hidden fixed inset-0 bg-primary/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
        <div class="bg-white rounded-[40px] p-8 w-full max-w-2xl overflow-y-auto max-h-[80vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 id="dayModalTitle" class="text-xl font-black text-primary border-l-4 border-gold pl-4 uppercase">รายการหนังสือรับ</h3>
                <button onclick="closeDayModal()" class="text-gray-400 text-2xl hover:text-red-500 transition"><i class="fa-solid fa-circle-xmark"></i></button>
            </div>
            <div id="dayDocList" class="space-y-4"></div>
        </div>
    </div>

    <div id="docModal" class="hidden fixed inset-0 bg-primary/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[40px] p-8 w-full max-w-4xl overflow-y-auto max-h-[90vh] shadow-2xl">
            <h3 class="text-2xl font-black text-primary mb-8 border-l-4 border-gold pl-4 uppercase">ลงข้อมูลหนังสือรับ</h3>
            <form id="docForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <input type="hidden" id="docId">
                <div class="md:col-span-1"><label class="text-[11px] font-black text-gray-400 uppercase">เลขรับที่</label><input type="text" id="f_receiveNo2" class="w-full bg-gray-50 border-none rounded-2xl p-4 outline-none font-bold text-lg" placeholder="ระบุเลขรับที่"></div>
                <div class="md:col-span-1"><label class="text-[11px] font-black text-gray-400 uppercase">เลขรับหนังสือ</label><input type="text" id="f_receiveNo" class="w-full bg-gray-50 border-none rounded-2xl p-4 outline-none font-bold text-lg"></div>
                <div class="md:col-span-1"><label class="text-[11px] font-black text-gray-400 uppercase">ส่งมาจากหน่วยงาน</label><input type="text" id="f_fromOrg" class="w-full bg-gray-50 border-none rounded-2xl p-4 outline-none font-bold text-lg"></div>
                <div class="md:col-span-3"><label class="text-[11px] font-black text-gray-400 uppercase">ชื่อเรื่องรับ</label><input type="text" id="f_subject" class="w-full bg-gray-50 border-none rounded-2xl p-4 outline-none font-bold text-xl"></div>
                <div class="md:col-span-1"><label class="text-[11px] font-black text-gray-400 uppercase">วันที่ออกหนังสือ</label><input type="date" id="f_bookDate" class="w-full bg-gray-50 border-none rounded-2xl p-4 outline-none font-bold"></div>
                <div class="md:col-span-1"><label class="text-[11px] font-black text-gray-400 uppercase">วันที่ลงรับ</label><input type="date" id="f_receivedDate" class="w-full bg-gray-50 border-none rounded-2xl p-4 outline-none font-bold"></div>
                <div class="md:col-span-1"><label class="text-[11px] font-black text-gray-400 uppercase">ผู้รับผิดชอบ (กองงาน)</label>
                    <select id="f_owner" class="w-full bg-gray-50 border-none rounded-2xl p-4 outline-none font-bold text-lg">
                        <option value="">-- รอระบุ --</option><option value="สำนักปลัด">สำนักปลัด</option><option value="กองคลัง">กองคลัง</option><option value="กองช่าง">กองช่าง</option><option value="กองการศึกษา">กองการศึกษา</option><option value="นักทรัพย์">นักทรัพย์</option><option value="นิติกร">นิติกร</option><option value="งานป้องกัน">งานป้องกัน</option><option value="งานสภา">งานสภา</option><option value="ประชาสัมพันธ์">ประชาสัมพันธ์</option><option value="นักจัดการ">นักจัดการ</option><option value="สาธารณสุข">สาธารณสุข</option><option value="สปสช">สปสช</option><option value="ตรวจสอบภายใน">ตรวจสอบภายใน</option><option value="ธุรการ">ธุรการ</option><option value="เกษตร">เกษตร</option><option value="สิ่งแวดล้อม">สิ่งแวดล้อม</option>
                    </select>
                </div>
                <div class="md:col-span-3"><label class="text-[11px] font-black text-blue-400 uppercase">ลิงก์ Google Drive (PDF)</label><input type="text" id="f_fileUrl" placeholder="https://drive.google.com/..." class="w-full bg-blue-50 border-2 border-blue-100 rounded-2xl p-4 outline-none text-blue-600 font-bold"></div>
                <div class="md:col-span-3 flex justify-end gap-3 mt-4 border-t pt-8">
                    <button type="button" onclick="closeModal()" class="px-8 py-3 text-gray-400 font-bold">ยกเลิก</button>
                    <button type="button" onclick="saveDoc()" id="btnSave" class="px-14 py-4 bg-primary text-white font-black rounded-2xl shadow-xl hover:scale-105 transition">บันทึกข้อมูลเข้าชีท</button>
                </div>
            </form>
        </div>
    </div>

    <div id="loginModal" class="hidden fixed inset-0 bg-primary/60 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white rounded-[40px] p-10 max-w-sm w-full text-center shadow-2xl">
            <h3 class="text-2xl font-black text-primary mb-6 uppercase">Admin Login</h3>
            <input type="password" id="passwordInput" placeholder="••••" class="w-full bg-gray-100 rounded-2xl p-5 text-center text-4xl outline-none border-2 focus:border-primary mb-6 font-bold">
            <button onclick="attemptLogin()" class="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-xl hover:bg-black transition">ยืนยัน</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyGa_dNlU6HQTbRYHL5qvY0U3og8US0VCJMsEK6SaBm8U7onG7SzkrhZurYZ6H1rsFV/exec";
        let isAdmin = false, documents = [];
        let currentCalMonth = new Date().getMonth();
        let currentCalYear = new Date().getFullYear();

        function formatDateForInput(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            return d.toISOString().split('T')[0];
        }

        function formatThaiDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        document.addEventListener('DOMContentLoaded', fetchData);
        async function fetchData() {
            try {
                const res = await fetch(API_URL + "?action=read");
                const data = await res.json();
                if(data) { 
                    // 🟢 ปรับการจัดเรียงตามเลขรับที่ (receiveNo2) จากมากไปน้อย
                    documents = data.sort((a, b) => {
                        const noA = parseInt(a.receiveNo2) || 0;
                        const noB = parseInt(b.receiveNo2) || 0;
                        return noB - noA;
                    });
                    renderAll(); 
                }
            } catch (e) { console.error("Load Error"); }
        }

        function toggleAuth() { if(isAdmin) { isAdmin = false; updateAuthUI(); } else document.getElementById('loginModal').classList.remove('hidden'); }
        function attemptLogin() { if(document.getElementById('passwordInput').value === 'cp123'){ isAdmin=true; document.getElementById('loginModal').classList.add('hidden'); updateAuthUI(); document.getElementById('passwordInput').value=''; } else alert('รหัสผิด'); }
        
        function updateAuthUI() { 
            document.getElementById('authLabel').innerText = isAdmin ? 'ADMIN MODE' : 'GUEST MODE';
            document.getElementById('authBtn').className = isAdmin ? 'bg-gold text-white px-6 py-2 rounded-full text-xs font-bold shadow-lg transition-all' : 'bg-white text-primary px-6 py-2 rounded-full text-xs font-bold shadow-lg transition-all';
            document.getElementById('addDocBtn').classList.toggle('hidden', !isAdmin);
            renderAll();
        }

        function switchTab(t) { 
            ['dashboard', 'by-owner', 'calendar'].forEach(v => {
                const view = document.getElementById(`view-${v}`);
                if(view) view.classList.toggle('hidden', v!==t);
                const btn = document.getElementById(`tab-${v}`);
                if(btn) { btn.classList.toggle('bg-primary', v===t); btn.classList.toggle('text-white', v===t); btn.classList.toggle('bg-white', v!==t); btn.classList.toggle('text-gray-400', v!==t); }
            });
            if(t === 'calendar') renderCalendar();
        }

        function openModal(id = null) {
            document.getElementById('docModal').classList.remove('hidden');
            document.getElementById('docForm').reset();
            document.getElementById('docId').value = id || '';
            if(id) {
                const d = documents.find(x => x.id === id);
                document.getElementById('f_receiveNo2').value = d.receiveNo2 || '';
                document.getElementById('f_receiveNo').value = d.receiveNo || '';
                document.getElementById('f_subject').value = d.subject || '';
                document.getElementById('f_fromOrg').value = d.fromOrg || '';
                document.getElementById('f_owner').value = d.owner || '';
                document.getElementById('f_fileUrl').value = d.fileUrl || '';
                document.getElementById('f_bookDate').value = formatDateForInput(d.bookDate);
                document.getElementById('f_receivedDate').value = formatDateForInput(d.receivedDate);
            }
        }
        function closeModal() { document.getElementById('docModal').classList.add('hidden'); }

        async function saveDoc() {
            const btn = document.getElementById('btnSave');
            btn.disabled = true; btn.innerText = "กำลังส่งข้อมูล...";
            const id = document.getElementById('docId').value;
            const isEdit = !!id;
            const doc = {
                id: id || 'ID-' + Date.now(),
                receiveNo2: document.getElementById('f_receiveNo2').value,
                receiveNo: document.getElementById('f_receiveNo').value,
                subject: document.getElementById('f_subject').value,
                bookDate: document.getElementById('f_bookDate').value,
                receivedDate: document.getElementById('f_receivedDate').value,
                fromOrg: document.getElementById('f_fromOrg').value,
                owner: document.getElementById('f_owner').value,
                fileUrl: document.getElementById('f_fileUrl').value.trim(),
                status: isEdit ? documents.find(x=>x.id===id).status : "ลงรับแล้ว"
            };
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: isEdit?'update':'create', data: doc }) });
            closeModal(); fetchData(); btn.disabled = false; btn.innerText = "บันทึกข้อมูล";
        }

        async function updateStatus(id, s) {
            documents.find(x=>x.id===id).status = s; renderAll();
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStatus', id: id, status: s }) });
            fetchData();
        }

        async function confirmReceipt(id) {
            const today = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
            if(!confirm('ยืนยันว่ากองได้รับหนังสือแล้ว ณ วันที่ ' + today + '?')) return;
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updateStatus', id: id, status: 'กำลังเสนอ', ownerReceivedDate: today }) });
            fetchData();
        }

        async function deleteDoc(id) {
            if(!confirm('ยืนยันการลบ?')) return;
            documents = documents.filter(x=>x.id!==id); renderAll();
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', id: id }) });
            fetchData();
        }

        function renderAll() {
            renderStats();
            renderCards(documents, 'dashboard-cards');
            renderByOwner();
            renderCalendar();
        }

        function renderStats() {
            const area = document.getElementById('stats-area');
            area.innerHTML = `
                <div class="glass-card p-6 border-l-4 border-primary"><p class="text-[10px] font-black text-gray-400 uppercase">ทั้งหมด</p><h3 class="text-3xl font-black text-primary">${documents.length}</h3></div>
                <div class="glass-card p-6 border-l-4 border-amber-500"><p class="text-[10px] font-black text-gray-400 uppercase">ลงรับแล้ว</p><h3 class="text-3xl font-black text-amber-500">${documents.filter(x=>x.status==="ลงรับแล้ว").length}</h3></div>
                <div class="glass-card p-6 border-l-4 border-indigo-500"><p class="text-[10px] font-black text-gray-400 uppercase">กำลังเสนอ</p><h3 class="text-3xl font-black text-indigo-500">${documents.filter(x=>x.status==="กำลังเสนอ").length}</h3></div>
                <div class="bg-primary p-6 rounded-[28px] shadow-2xl text-white"><p class="text-[10px] font-black text-blue-200 uppercase">เสร็จสิ้น</p><h3 class="text-3xl font-black text-white">${documents.filter(x=>x.status==="เสร็จสิ้น").length}</h3></div>
            `;
        }

        function renderByOwner() {
            const owner = document.getElementById('ownerFilter').value;
            if(!owner) { document.getElementById('owner-cards').innerHTML = ''; return; }
            renderCards(documents.filter(x => x.owner === owner), 'owner-cards');
        }

        function renderCards(list, containerId) {
            const container = document.getElementById(containerId); container.innerHTML = '';
            const statusFlow = ["ลงรับแล้ว", "กำลังเสนอ", "เสร็จสิ้น"];
            list.forEach(d => {
                const step = statusFlow.indexOf(d.status);
                const progressWidth = (step / 2) * 100 + '%';
                container.innerHTML += `
                <div class="glass-card p-8 flex flex-col h-full relative">
                    ${isAdmin ? `
                    <div class="absolute top-6 right-6 flex gap-3 text-gray-300">
                        <button onclick="openModal('${d.id}')" class="hover:text-blue-500 transition text-lg"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteDoc('${d.id}')" class="hover:text-red-500 transition text-lg"><i class="fa-solid fa-trash-can"></i></button>
                    </div>` : ''}
                    <div class="mb-6">
                        <span class="text-[10px] font-black px-3 py-1.5 rounded-lg ${d.status==='เสร็จสิ้น'?'bg-green-100 text-green-600':'bg-amber-100 text-amber-600'}">${d.status}</span>
                        <div class="mt-5 space-y-1">
                             <p class="text-[13px] text-primary font-black uppercase">เลขรับที่ : <span class="bg-blue-100 px-2 py-0.5 rounded text-blue-700 font-black">${d.receiveNo2 || '-'}</span></p>
                             <p class="text-[12px] text-gray-400 font-bold uppercase">เลขรับหนังสือ : <span class="text-gray-700 font-bold">${d.receiveNo || '-'}</span></p>
                        </div>
                        <h4 class="text-[15px] font-bold text-gray-800 leading-relaxed bg-yellow-50/50 p-3 rounded-xl border border-yellow-100/50 mt-4 min-h-[80px]">${d.subject}</h4>
                    </div>
                    <div class="space-y-4 text-[14px] text-gray-600 mb-6 flex-grow border-t pt-5">
                        <div class="grid grid-cols-2 gap-4 text-[13px]">
                            <div><p class="text-gray-400 font-black uppercase text-[10px]">วันที่ออกหนังสือ</p><p class="font-bold text-gray-800 text-[14px]"><i class="fa-regular fa-calendar-check mr-1 text-gold"></i>${formatThaiDate(d.bookDate)}</p></div>
                            <div><p class="text-gray-400 font-black uppercase text-[10px]">วันที่ลงรับ</p><p class="font-bold text-gray-800 text-[14px]"><i class="fa-solid fa-calendar-day mr-1 text-blue-400"></i>${formatThaiDate(d.receivedDate)}</p></div>
                        </div>
                        <div class="pt-3 border-t border-dashed space-y-2">
                             <p class="text-[15px]">ส่งมาจาก: <span class="font-black text-gray-900">${d.fromOrg || '-'}</span></p>
                             <p class="text-[15px]">ผู้รับผิดชอบ: <span class="font-black text-primary">${d.owner || 'รอระบุ'}</span></p>
                        </div>
                        <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100/50">
                            <p class="text-[11px] font-black text-blue-400 uppercase">กองรับหนังสือเมื่อ</p>
                            <p class="font-black text-blue-700 text-[15px]">${d.ownerReceivedDate || 'ยังไม่ได้รับการยืนยัน'}</p>
                        </div>
                        ${!d.ownerReceivedDate ? `<button onclick="confirmReceipt('${d.id}')" class="w-full bg-white text-blue-600 py-3.5 rounded-xl font-black text-sm mt-2 border-2 border-blue-100 hover:bg-blue-600 hover:text-white transition shadow-sm">ยืนยันได้รับหนังสือแล้ว</button>` : ''}
                        ${d.fileUrl ? `<a href="${d.fileUrl}" target="_blank" class="flex items-center justify-center gap-3 w-full bg-primary text-white py-4 rounded-2xl font-black text-sm shadow-xl hover:bg-black transition mt-4"><i class="fa-solid fa-file-pdf text-lg text-gold"></i> เปิดดูเอกสารฉบับเต็ม</a>`:''}
                    </div>
                    <div class="progress-wrapper">
                        <div class="progress-line-bg"><div class="progress-line-fill" style="width: ${progressWidth}"></div></div>
                        <div class="status-steps">
                            ${statusFlow.map((s, i) => `<div class="step-item ${step >= i ? 'active' : ''}"><div class="step-dot"></div><div class="step-label">${s}</div></div>`).join('')}
                        </div>
                    </div>
                    ${isAdmin ? `
                    <div class="flex justify-between items-center mt-6 pt-5 border-t border-gray-50">
                        <button onclick="updateStatus('${d.id}', '${statusFlow[step-1]}')" class="text-[12px] font-black text-gray-400 hover:text-primary ${step===0?'invisible':''}">ย้อนกลับ</button>
                        <button onclick="updateStatus('${d.id}', '${statusFlow[step+1]}')" class="bg-gold text-primary px-8 py-3.5 rounded-xl text-[12px] font-black shadow-lg hover:scale-105 active:scale-95 ${step===2?'hidden':''}">ถัดไป <i class="fa-solid fa-angle-right ml-1"></i></button>
                    </div>` : ''}
                </div>`;
            });
        }

        // 🟢 ระบบปฏิทิน
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthDisp = document.getElementById('monthDisplay');
            grid.innerHTML = '';
            
            const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay();
            const lastDate = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
            const today = new Date();
            
            monthDisp.innerText = new Date(currentCalYear, currentCalMonth).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });

            // วันว่างช่วงต้นเดือน
            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="cal-day bg-gray-50/50"></div>`;
            }

            // วันที่จริง
            for (let day = 1; day <= lastDate; day++) {
                const dateKey = `${currentCalYear}-${String(currentCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const docsInDay = documents.filter(d => d.receivedDate && d.receivedDate.startsWith(dateKey));
                const isToday = today.getDate() === day && today.getMonth() === currentCalMonth && today.getFullYear() === currentCalYear;

                grid.innerHTML += `
                    <div onclick="showDayDetails('${dateKey}', ${day})" class="cal-day p-2 flex flex-col gap-1 ${isToday ? 'cal-today' : ''}">
                        <span class="text-xs font-black ${isToday ? 'text-blue-600' : 'text-gray-400'}">${day}</span>
                        ${docsInDay.length > 0 ? `<div class="mt-auto flex flex-col gap-1">
                            <span class="cal-badge">${docsInDay.length} เรื่อง</span>
                            <div class="h-1 w-full bg-gold rounded-full"></div>
                        </div>` : ''}
                    </div>
                `;
            }
        }

        function changeMonth(step) {
            currentCalMonth += step;
            if (currentCalMonth > 11) { currentCalMonth = 0; currentCalYear++; }
            if (currentCalMonth < 0) { currentCalMonth = 11; currentCalYear--; }
            renderCalendar();
        }

        function showDayDetails(dateKey, dayNum) {
            const docs = documents.filter(d => d.receivedDate && d.receivedDate.startsWith(dateKey));
            if(docs.length === 0) return;

            const modal = document.getElementById('dayModal');
            const list = document.getElementById('dayDocList');
            document.getElementById('dayModalTitle').innerText = `รายการวันที่ ${dayNum} ${new Date(currentCalYear, currentCalMonth).toLocaleDateString('th-TH', { month: 'long' })}`;
            
            list.innerHTML = docs.map(d => `
                <div class="p-4 bg-gray-50 rounded-2xl border-l-4 border-gold shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-primary bg-white px-2 py-1 rounded shadow-sm">เลขรับ: ${d.receiveNo2}</span>
                        <span class="text-[10px] font-bold text-gray-400 italic">${d.owner || 'ไม่ระบุหน่วยงาน'}</span>
                    </div>
                    <p class="text-sm font-bold text-gray-800">${d.subject}</p>
                </div>
            `).join('');
            
            modal.classList.remove('hidden');
        }

        function closeDayModal() { document.getElementById('dayModal').classList.add('hidden'); }
    </script>
</body>
</html>
